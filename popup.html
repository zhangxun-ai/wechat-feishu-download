<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文档本地导出</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="app">
      <header class="hero">
        <p class="eyebrow">MVP</p>
        <h1>文档本地导出</h1>
        <p class="subtitle">支持飞书文档、微信公众号文章，以及当前网页导出到本地。</p>
      </header>

      <section class="panel">
        <div id="status" class="status status-loading">正在检测当前页面…</div>

        <div class="meta">
          <div class="meta-row">
            <span class="meta-label">标题</span>
            <span id="docTitle" class="meta-value">-</span>
          </div>
          <div class="meta-row">
            <span class="meta-label">类型</span>
            <span id="docType" class="meta-value">-</span>
          </div>
        </div>

        <div class="actions">
          <button id="exportMarkdown" class="button button-primary" disabled>导出 Markdown</button>
          <button id="exportCourse" class="button" hidden disabled>导出当前专栏</button>
        </div>

        <label class="toggle" for="includeImages">
          <input id="includeImages" type="checkbox" checked>
          <span class="toggle-copy">
            <span class="toggle-title">Markdown 包含图片</span>
            <span class="toggle-desc">关闭后只导出正文文字，速度更快，也更适合做 AI 分析。</span>
          </span>
        </label>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>批量下载</h2>
          <p class="subtitle-inline">点击后会打开任务页，批量下载会在任务页继续执行。</p>
        </div>

        <div id="batchStatus" class="status status-loading">尚未开始批量任务。</div>

        <div class="field-group">
          <label class="field-label" for="batchLinks">文章链接列表</label>
          <textarea
            id="batchLinks"
            class="text-input text-area"
            placeholder="每行一个链接。批量下载当前仍只支持飞书 docx/wiki 与微信公众号文章链接。"
          ></textarea>
          <label class="toggle" for="batchZipOutput">
            <input id="batchZipOutput" type="checkbox" checked>
            <span class="toggle-copy">
              <span class="toggle-title">批量结果打包为 ZIP</span>
              <span class="toggle-desc">推荐开启，更方便保存和管理。</span>
            </span>
          </label>
          <button id="batchDownloadLinks" class="button button-primary">批量下载链接列表</button>
          <div id="batchLog" class="log" aria-live="polite"></div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>公众号后台模式</h2>
        </div>

        <div class="note-card note-card-highlight">
          <p class="note-title">使用前先完成这一步</p>
          <p class="note-copy">先在当前 Chrome 登录 `mp.weixin.qq.com`，再回来执行“按范围批量下载”。</p>
        </div>

        <div id="helperStatus" class="status status-loading">尚未检测公众号后台登录状态。</div>

        <div class="field-group">
          <label class="field-label" for="helperSeedUrl">种子文章链接</label>
          <textarea
            id="helperSeedUrl"
            class="text-input text-area text-area-compact"
            placeholder="粘贴该公众号任意一篇文章链接，扩展会用它识别公众号并定位同号历史文章。"
          ></textarea>
        </div>

        <div class="field-row">
          <div class="field-group field-group-tight">
            <label class="field-label" for="helperStartDate">开始日期</label>
            <input id="helperStartDate" class="text-input" type="date">
          </div>
          <div class="field-group field-group-tight">
            <label class="field-label" for="helperEndDate">结束日期</label>
            <input id="helperEndDate" class="text-input" type="date">
          </div>
        </div>

        <label class="toggle toggle-compact" for="includeImagesHelper">
          <input id="includeImagesHelper" type="checkbox" checked>
          <span class="toggle-copy">
            <span class="toggle-title">下载正文图片</span>
            <span class="toggle-desc">关闭后只导出正文文字，速度更快，也更适合做 AI 分析。</span>
          </span>
        </label>

        <div class="actions actions-uneven">
          <button id="helperCheck" class="button">检测后台登录</button>
          <button id="openWechatMpLogin" class="button">打开后台登录页</button>
          <button id="helperDownload" class="button button-primary">按范围批量下载</button>
        </div>

        <div id="helperLog" class="log" aria-live="polite"></div>
      </section>
    </main>

    <script src="shared/export-url-utils.js"></script>
    <script src="wechat-markdown-cleanup.js"></script>
    <script type="module" src="popup.js"></script>
  </body>
</html>
