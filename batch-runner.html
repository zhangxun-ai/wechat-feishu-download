<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>批量下载任务</title>
    <link rel="stylesheet" href="batch-runner.css">
  </head>
  <body>
    <main class="app">
      <header class="hero">
        <p class="eyebrow">TASK</p>
        <h1 id="jobTitle">批量下载任务</h1>
        <p id="jobMeta" class="subtitle">正在准备任务…</p>
      </header>

      <section id="summaryPanel" class="panel summary-panel">
        <div id="jobStatus" class="status status-loading">正在读取任务数据…</div>

        <div id="obsidianRetryPanel" class="retry-panel" hidden>
          <div class="panel-headline">Obsidian 重试</div>
          <p id="obsidianRetryCopy" class="retry-copy">当前任务已导出完成，但写入 Obsidian 失败。</p>
          <div class="retry-actions">
            <button id="retryObsidianWrite" class="retry-button">授权并重试写入 Obsidian</button>
          </div>
        </div>

        <div id="resultActions" class="result-actions">
          <button id="showResultDetails" class="button button-subtle" type="button">查看导出结果</button>
          <button id="showWorkerDetails" class="button button-subtle detailsToggle" type="button">查看并行通道</button>
          <button id="showLogDetails" class="button button-subtle detailsToggle" type="button">查看详细日志</button>
        </div>

        <div id="resultSummary" class="result-summary" hidden>
          <div class="panel-headline">导出结果</div>
          <div id="resultList" class="result-list"></div>
        </div>

        <div class="stats">
          <div class="stat-card">
            <span class="stat-label">进度</span>
            <span id="jobProgress" class="stat-value">0 / 0</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">成功</span>
            <span id="jobSuccess" class="stat-value">0</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">失败</span>
            <span id="jobFailure" class="stat-value">0</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">通道</span>
            <span id="jobWorkers" class="stat-value">-</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">耗时</span>
            <span id="jobElapsed" class="stat-value">00:00</span>
          </div>
        </div>
      </section>

      <details id="workerDetails" class="panel detail-card" hidden>
        <summary class="detail-toggle">并行通道</summary>
        <div id="workerPanel" class="worker-panel" hidden>
          <div id="workerGrid" class="worker-grid"></div>
        </div>
      </details>

      <details id="logDetails" class="panel detail-card detail-card-log">
        <summary class="detail-toggle">详细日志</summary>
        <div id="jobLog" class="log" aria-live="polite"></div>
      </details>
    </main>

    <script src="shared/export-url-utils.js"></script>
    <script src="shared/export-ui-models.js"></script>
    <script src="shared/course-export-builders.js"></script>
    <script src="shared/course-export-runtime.js"></script>
    <script src="shared/obsidian-export.js"></script>
    <script src="shared/obsidian-vault-storage.js"></script>
    <script src="wechat-markdown-cleanup.js"></script>
    <script src="wechat-direct-export.js"></script>
    <script type="module" src="batch-runner.js"></script>
  </body>
</html>
